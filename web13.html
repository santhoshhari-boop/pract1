<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteTrack – Construction Task Manager</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#ddd6c8;--accent:#d9730d;--accent-d:#b45f0a;--danger:#c0392b;
--todo:#64748b;--prog:#2563eb;--block:#c0392b;--done:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222428;--text:#eceef1;--muted:#9aa1ab;--line:#383b41;--accent:#f0912f;--accent-d:#ffa94d;--danger:#ef6a5b;--todo:#94a3b8;--prog:#60a5fa;--block:#ef6a5b;--done:#4cc38a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222428;--text:#eceef1;--muted:#9aa1ab;--line:#383b41;--accent:#f0912f;--accent-d:#ffa94d;--danger:#ef6a5b;--todo:#94a3b8;--prog:#60a5fa;--block:#ef6a5b;--done:#4cc38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:1050px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 2px;font-size:1.6rem}
.sub{margin:0 0 18px;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.05rem}
ul.stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
ul.stats li{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;transition:transform .15s}
ul.stats li:hover{transform:translateY(-2px)}
ul.stats b{font-size:1.4rem}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.full{grid-column:1/-1}
textarea{resize:vertical;min-height:60px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;transition:background .15s,transform .1s}
button:hover{background:var(--bg)}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-d)}
button.del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:2;min-width:160px}.toolbar select{flex:1;min-width:130px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--bg)}
td small{display:block;color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.High{color:var(--danger)}.Medium{color:var(--accent-d)}.Low{color:var(--done)}
td select{padding:5px 8px;width:auto}
.row-actions{display:flex;gap:6px}
.row-actions button{padding:5px 10px;font-size:.85rem}
.overdue{color:var(--danger);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px}
/* ===== Anime / modern theme ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#120a24;--card:rgba(255,255,255,.06);--text:#f3eeff;--muted:#b4a6d8;--line:rgba(255,255,255,.14);--accent:#ff4fa3;--accent-d:#ff7ac0;--danger:#ff6b81;--todo:#a5b4fc;--prog:#22d3ee;--block:#ff6b81;--done:#5eead4}
body{background:radial-gradient(circle at 15% 0%,#3b1d6e 0,transparent 45%),radial-gradient(circle at 90% 20%,#0e4a63 0,transparent 40%),linear-gradient(160deg,#120a24,#1d1240 60%,#2a1050) fixed;min-height:100vh}
section{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.35);transition:border-color .2s,transform .2s}
section:hover{border-color:rgba(255,79,163,.5)}
h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,#ff4fa3,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
button.primary{background:linear-gradient(90deg,#ff4fa3,#8b5cf6);border:none;box-shadow:0 0 18px rgba(255,79,163,.45)}
button.primary:hover{background:linear-gradient(90deg,#ff7ac0,#a78bfa);box-shadow:0 0 28px rgba(255,79,163,.7)}
button.ghost{border-color:rgba(255,255,255,.25);border-radius:99px;font-size:.85rem}
input,select,textarea{background:rgba(0,0,0,.3)}
option{background:#1d1240;color:#fff}
tbody tr:hover{background:rgba(255,79,163,.1)}
ul.stats li{background:rgba(255,255,255,.04);border-radius:12px}
/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3b1d6e,#120a24 70%);overflow:hidden;transition:opacity .7s,visibility .7s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 4deg,transparent 4deg 12deg);animation:spin 40s linear infinite}
.logo{position:relative;text-align:center;padding:20px}
.emblem{position:relative;width:130px;height:130px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:62px;font-weight:900;color:#fff;background:conic-gradient(#ff4fa3,#8b5cf6,#22d3ee,#ff4fa3);animation:pop .9s cubic-bezier(.2,1.6,.4,1) both,glow 1.8s ease-in-out infinite alternate}
.emblem::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#1a1033}
.emblem span{position:relative;text-shadow:0 0 18px #ff4fa3}
.brand{margin:0;font-size:clamp(2rem,9vw,3.6rem);font-weight:900;letter-spacing:.18em;background:linear-gradient(90deg,#ff4fa3,#c4b5fd,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s .4s both}
.tag{margin:6px 0 0;color:#c9b8ff;letter-spacing:.3em;font-size:.75rem;text-transform:uppercase;animation:rise .8s .7s both}
.bar{width:220px;height:6px;border-radius:9px;background:rgba(255,255,255,.15);margin:22px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4fa3,#22d3ee);animation:fill 2.8s ease forwards}
#enterBtn{margin-top:18px;border-radius:99px;padding:9px 26px;border:1px solid #ff4fa3;color:#fff;background:rgba(255,79,163,.15);animation:rise .8s 1.1s both}
#enterBtn:hover{background:#ff4fa3}
.petal{position:absolute;top:-30px;width:12px;height:16px;background:#ffb7d5;border-radius:100% 0 100% 0;opacity:.85;animation:fall linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 0 30px #ff4fa3aa,0 0 60px #8b5cf655}to{box-shadow:0 0 55px #22d3eeaa,0 0 110px #ff4fa388}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{to{width:100%}}
@keyframes fall{to{transform:translate(80px,110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.rays,.petal,.emblem{animation:none}}
</style>
</head>
<body>
<div id="splash" role="dialog" aria-label="Intro">
  <div class="rays"></div>
  <div class="logo">
    <div class="emblem"><span>建</span></div>
    <h2 class="brand">SITETRACK</h2>
    <p class="tag">Build · Track · Conquer</p>
    <div class="bar"><i></i></div>
    <button type="button" id="enterBtn">Enter site ▸</button>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <h1>🏗️ SiteTrack</h1>
    <button type="button" class="ghost" id="replayBtn">▶ Replay intro</button>
  </header>
  <p class="sub">Construction site task manager – assign work by trade, zone and priority, and track it to completion.</p>

  <section aria-label="Summary">
    <h2>Site overview</h2>
    <ul class="stats" id="stats"></ul>
  </section>

  <section aria-label="Task form">
    <h2 id="formTitle">Add a new task</h2>
    <form id="taskForm">
      <label>Task title<input id="title" required maxlength="80" placeholder="e.g. Pour slab – Block B"></label>
      <label>Site zone<input id="zone" required placeholder="e.g. Block B, Level 2"></label>
      <label>Trade
        <select id="trade">
          <option>Civil</option><option>Electrical</option><option>Plumbing</option>
          <option>HVAC</option><option>Safety &amp; Inspection</option><option>Finishing</option>
        </select>
      </label>
      <label>Assigned to<input id="assignee" required placeholder="Foreman / crew"></label>
      <label>Priority
        <select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select>
      </label>
      <label>Due date<input id="due" type="date" required></label>
      <label>Status
        <select id="status"><option>To Do</option><option>In Progress</option><option>Blocked</option><option>Done</option></select>
      </label>
      <label class="full">Notes (materials, permits, hazards)<textarea id="notes"></textarea></label>
      <div class="actions full">
        <button type="submit" class="primary" id="saveBtn">Add task</button>
        <button type="button" id="cancelBtn" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section aria-label="Task list">
    <h2>Task register</h2>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search title, zone or assignee…">
      <select id="filterStatus"><option value="">All statuses</option><option>To Do</option><option>In Progress</option><option>Blocked</option><option>Done</option></select>
      <select id="filterTrade"><option value="">All trades</option><option>Civil</option><option>Electrical</option><option>Plumbing</option><option>HVAC</option><option>Safety &amp; Inspection</option><option>Finishing</option></select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Task</th><th>Trade</th><th>Assigned</th><th>Priority</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const KEY = 'sitetrack.tasks';
const STATUSES = ['To Do','In Progress','Blocked','Done'];
const COLORS = {'To Do':'var(--todo)','In Progress':'var(--prog)','Blocked':'var(--block)','Done':'var(--done)'};
let tasks = [];
let editingId = null;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ tasks = JSON.parse(raw); return; }
  }catch(e){ tasks = []; }
  const d = n => { const t = new Date(); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };
  tasks = [
    {id:1,title:'Rebar inspection – foundation',zone:'Block A, Basement',trade:'Safety & Inspection',assignee:'R. Kumar',priority:'High',due:d(1),status:'In Progress',notes:'Inspector arrives 9 AM.'},
    {id:2,title:'Conduit layout – Level 2',zone:'Block B, Level 2',trade:'Electrical',assignee:'S. Meena',priority:'Medium',due:d(5),status:'To Do',notes:''},
    {id:3,title:'Drainage pipe fitting',zone:'Block A, Level 1',trade:'Plumbing',assignee:'M. Ali',priority:'Medium',due:d(-2),status:'Blocked',notes:'Waiting for PVC delivery.'}
  ];
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }catch(e){}
}

const $ = id => document.getElementById(id);
const form = $('taskForm');

function el(tag, props, text){
  const n = document.createElement(tag);
  if(props) Object.assign(n, props);
  if(text !== undefined) n.textContent = text;
  return n;
}

function renderStats(){
  const ul = $('stats');
  ul.innerHTML = '';
  STATUSES.forEach(s => {
    const li = el('li');
    li.style.setProperty('--c', COLORS[s]);
    li.appendChild(el('span', null, s));
    li.appendChild(el('b', null, String(tasks.filter(t => t.status === s).length)));
    ul.appendChild(li);
  });
}

function visibleTasks(){
  const q = $('search').value.trim().toLowerCase();
  const st = $('filterStatus').value, tr = $('filterTrade').value;
  return tasks.filter(t =>
    (!st || t.status === st) && (!tr || t.trade === tr) &&
    (!q || [t.title,t.zone,t.assignee].some(v => v.toLowerCase().includes(q)))
  );
}

function renderTable(){
  const tbody = $('tbody');
  tbody.innerHTML = '';
  const list = visibleTasks();
  if(!list.length){
    const tr = el('tr'); const td = el('td', {colSpan:7, className:'empty'}, 'No tasks match. Add one above.');
    tr.appendChild(td); tbody.appendChild(tr); return;
  }
  const today = new Date().toISOString().slice(0,10);
  list.forEach(t => {
    const tr = el('tr');
    const c1 = el('td'); c1.appendChild(el('strong', null, t.title));
    c1.appendChild(el('small', null, t.zone + (t.notes ? ' · ' + t.notes : '')));
    tr.appendChild(c1);
    tr.appendChild(el('td', null, t.trade));
    tr.appendChild(el('td', null, t.assignee));
    const c4 = el('td'); c4.appendChild(el('span', {className:'pill ' + t.priority}, t.priority)); tr.appendChild(c4);
    const c5 = el('td', null, t.due);
    if(t.due < today && t.status !== 'Done') c5.className = 'overdue';
    tr.appendChild(c5);

    const c6 = el('td');
    const sel = el('select');
    STATUSES.forEach(s => { const o = el('option', {value:s}, s); if(s === t.status) o.selected = true; sel.appendChild(o); });
    sel.addEventListener('change', () => {
      const task = tasks.find(x => x.id === t.id);
      task.status = sel.value; save(); render();
    });
    c6.appendChild(sel); tr.appendChild(c6);

    const c7 = el('td'); const box = el('div', {className:'row-actions'});
    const eb = el('button', {type:'button'}, 'Edit');
    eb.addEventListener('click', () => startEdit(t.id));
    const db = el('button', {type:'button', className:'del'}, 'Delete');
    db.addEventListener('click', () => {
      if(!confirm('Delete “' + t.title + '”?')) return;
      tasks = tasks.filter(x => x.id !== t.id);
      tr.remove(); save(); renderStats();
      if(editingId === t.id) resetForm();
      if(!tbody.children.length) renderTable();
    });
    box.appendChild(eb); box.appendChild(db); c7.appendChild(box); tr.appendChild(c7);
    tbody.appendChild(tr);
  });
}

function render(){ renderStats(); renderTable(); }

function startEdit(id){
  const t = tasks.find(x => x.id === id);
  editingId = id;
  ['title','zone','trade','assignee','priority','due','status','notes'].forEach(k => $(k).value = t[k]);
  $('formTitle').textContent = 'Edit task';
  $('saveBtn').textContent = 'Update task';
  $('cancelBtn').hidden = false;
  form.scrollIntoView({behavior:'smooth', block:'center'});
}

function resetForm(){
  editingId = null; form.reset();
  $('formTitle').textContent = 'Add a new task';
  $('saveBtn').textContent = 'Add task';
  $('cancelBtn').hidden = true;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    title:$('title').value.trim(), zone:$('zone').value.trim(), trade:$('trade').value,
    assignee:$('assignee').value.trim(), priority:$('priority').value, due:$('due').value,
    status:$('status').value, notes:$('notes').value.trim()
  };
  if(editingId !== null){
    Object.assign(tasks.find(x => x.id === editingId), data);
  }else{
    tasks.push({id:Date.now(), ...data});
  }
  save(); resetForm(); render();
});
$('cancelBtn').addEventListener('click', resetForm);
['search','filterStatus','filterTrade'].forEach(id => $(id).addEventListener('input', renderTable));

load(); render();

// ===== Anime intro splash =====
const splash = $('splash');
let splashTimer;
for(let i = 0; i < 18; i++){
  const p = el('span', {className:'petal'});
  p.style.left = Math.random()*100 + '%';
  p.style.animationDuration = (5 + Math.random()*5) + 's';
  p.style.animationDelay = (-Math.random()*8) + 's';
  splash.appendChild(p);
}
function hideSplash(){ clearTimeout(splashTimer); splash.classList.add('hide'); }
function showSplash(){
  splash.classList.remove('hide');
  splash.querySelectorAll('.logo *').forEach(n => { n.style.animation = 'none'; void n.offsetHeight; n.style.animation = ''; });
  splashTimer = setTimeout(hideSplash, 4200);
}
$('enterBtn').addEventListener('click', hideSplash);
$('replayBtn').addEventListener('click', showSplash);
showSplash();
</script>
</body>
</html>
